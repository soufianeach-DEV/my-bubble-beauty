# Plan de déploiement Render (New > Blueprint) : service web Node (pages du site, compte, réservation, admin) à Francfort ; base Postgres chez Supabase (région Francfort).
# En-têtes, cache et redirections sont posés par server.mjs : les réglages headers/routes de Render ne valent que pour les sites statiques.
# Supabase gratuit : projet mis en pause après 7 jours sans activité, aucune sauvegarde automatique ; exporter la base régulièrement.
# Service gratuit Render : mis en veille sans trafic, premier affichage lent ; passer en payant avant d'ouvrir l'inscription à une vraie cliente.
# Nouveau nom : l'ancien site statique « my-bubble-beauty » ne peut pas devenir un service Node (type figé à la création) ; le supprimer une fois celui-ci validé.
# L'URL https://my-bubble-beauty-app.onrender.com doit figurer dans security.allowedDomains (astro.config.mjs) ; si Render y ajoute un suffixe, reporter l'URL réelle.
# region est figée à la création.
# HTTP -> HTTPS est automatique chez Render ; www -> domaine nu se règle dans Custom Domains.
services:
  - type: web
    runtime: node
    name: my-bubble-beauty-app
    region: frankfurt
    plan: free
    # Pas de branch : le service suit la branche du Blueprint (feat/reservation pour la recette, main ensuite)
    buildCommand: npm ci && npm run build
    startCommand: node server.mjs
    healthCheckPath: /fr/index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Supabase > Connect > Session pooler (port 5432), suivie de ?sslmode=require : la connexion directe de Supabase est en IPv6 seul, que Render ne joint pas
      - key: DATABASE_URL
        sync: false
      # Secrets saisis à la création du Blueprint, jamais écrits ici ; Render ne les redemande plus aux synchronisations suivantes
      - key: SITE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      # npm run admin:totp
      - key: ADMIN_TOTP_SECRET
        sync: false
      # À garder aussi hors de Render : le perdre invalide tous les mots de passe
      - key: PASSWORD_PEPPER
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false

